# Keeps the GitHub Actions and the Python dependencies current, as pull requests.
# Minor and patch updates arrive as one pull request per ecosystem; majors still come one each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        update-types: [minor, patch]
