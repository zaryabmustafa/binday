# Runs the self-check on every pull request and on main. The `test` job is the
# status check the "Protect main" ruleset requires before a pull request can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine dependencies
        run: python -m pip install paramiko psycopg2-binary
      - name: Self-check
        run: python test_app.py
      - name: Byte-compile every module
        run: python -m py_compile app.py gui.py demo.py testenv/seed.py testenv/verify.py assets/brand/make_brand.py
