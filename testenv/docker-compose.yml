# Local test server for the purge tool. Start with testenv/setup.sh (run inside WSL).
# - mattermost: Team Edition, named "mattermost" like a real install; mmctl runs in local mode.
# - postgres:   not published to the host; the tool reaches it through the SSH tunnel as host "postgres".
# - server:     stands in for the server's shell (SSH on localhost:2222, root, key auth only). It shares
#               Mattermost's data volume at /opt/mattermost/data and the Docker socket, so the tool's
#               `docker exec mattermost mmctl ...`, `du` and SFTP behave as on a real host.
name: mm-purge-test

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh first}
      POSTGRES_DB: mattermost
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 3s
      retries: 30

  mattermost:
    restart: unless-stopped
    image: mattermost/mattermost-team-edition:12.1.0
    container_name: mattermost
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${POSTGRES_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEAPICHANNELDELETION: "true"
      MMCTL_LOCAL: "true"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
    ports: ["127.0.0.1:8065:8065"]
    volumes: [mmdata:/mattermost/data]

  server:
    restart: unless-stopped
    build: ./server
    depends_on: [mattermost]
    ports: ["127.0.0.1:2222:22"]
    volumes:
      - mmdata:/opt/mattermost/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.keys/id_ed25519.pub:/root/.ssh/authorized_keys:ro

volumes:
  pgdata:
  mmdata:
